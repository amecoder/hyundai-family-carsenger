<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 가족방</title>
<style>
@font-face { font-family: "Asta Sans"; src: url("/fonts/AstaSans.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
:root {
  color-scheme: dark;
  /* Hyundai CI: Hyundai Blue #002c5f, Active Blue #00aad2, Sand #e4dcd3, Sky Blue #aacae6, Active Red #e63312 */
  --bg: #000d1c; --surface: #0d1927; --surface-2: #14202e; --raised: #1c2835; --line: #2a3541;
  --ink: #ffffff; --sand: #e4dcd3; --muted: #a09e9c; --brand: #002c5f; --sky: #aacae6;
  --car: #00aad2; --car-soft: #002c5f; --car-line: rgba(170, 202, 230, .35);
  --act: #00aad2; --on-act: #000d1c; --act-ink: #aacae6; --act-soft: rgba(0, 170, 210, .2);
  --red: #ef7a65; --red-fill: #e63312; --red-soft: rgba(230, 51, 18, .18);
  --warn: #c8a695; --warn-soft: rgba(163, 107, 79, .24); --warn-line: rgba(200, 166, 149, .45);
  --ok: #aacae6; --ok-soft: rgba(170, 202, 230, .14);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .45), 0 1px 3px 1px rgba(0, 0, 0, .25);
  --shadow-2: 0 2px 6px 2px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #00070f; color: var(--ink); font: 15px/1.5 "Asta Sans", "Noto Sans KR", system-ui, sans-serif; }
.app { max-width: 430px; height: 100%; margin: 0 auto; background: var(--bg); box-shadow: var(--shadow-2); display: flex; flex-direction: column; }
.top { background: var(--surface); padding: 12px 14px; box-shadow: var(--shadow-1); position: relative; z-index: 1; display: flex; gap: 10px; align-items: center; }
.ico { width: 36px; height: 36px; border-radius: 8px; background: var(--brand); color: var(--sand); display: grid; place-items: center; font-weight: 800; flex: none; }
.top .t { flex: 1; min-width: 0; }
.top small { display: block; color: var(--muted); font-size: .74rem; }
.top small.bad { color: var(--red); }
.who { display: flex; background: var(--bg); border-radius: 999px; padding: 3px; gap: 2px; }
.who button { border: 0; background: transparent; font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.who button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.empty { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 40px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.msg .av { width: 30px; height: 30px; border-radius: 50%; flex: none; color: #fff; font-size: .78rem; font-weight: 700; display: grid; place-items: center; }
.msg .b { border-radius: 12px; box-shadow: var(--shadow-1); padding: 8px 11px; font-size: .88rem; word-break: break-word; }
.msg small { display: block; color: var(--muted); font-size: .68rem; margin-top: 2px; }
.msg.car .av { background: var(--car); color: var(--bg); } .msg.car .b { background: var(--car-soft); border: 1px solid var(--car-line); }
.msg.fam .b { background: var(--raised); }
.msg.me { align-self: flex-end; flex-direction: row-reverse; } .msg.me .b { background: var(--act-soft); border: 0; } .msg.me small { text-align: right; }
.msg.safety .av { background: var(--warn); color: var(--bg); } .msg.safety .b { background: var(--warn-soft); border: 1px solid var(--warn-line); }
.quick { display: inline-block; margin-top: 6px; border: 0; border-radius: 999px; padding: 6px 12px; font-size: .8rem; font-weight: 600; background: var(--act); color: var(--on-act); --state: 0, 13, 28; cursor: pointer; }
.cs { display: inline-block; margin-top: 3px; font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
.cs.waiting { color: var(--warn); background: var(--warn-soft); } .cs.played { color: var(--ok); background: var(--ok-soft); }
.cs.skipped { color: var(--muted); background: var(--raised); }
.msg.me .cs { float: right; }
.sys { align-self: center; font-size: .74rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 12px 0; }
.actions button, .sheet button, .bar button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; min-height: 48px; border: 0; padding: 10px 12px; }
.actions .pick { background: var(--car-soft); color: var(--car); border: 1px solid var(--car-line); }
.actions .cheer { background: var(--act-soft); color: var(--act-ink); }
.actions button[aria-expanded="true"] { outline: 2px solid currentColor; }
.sheet { margin: 8px 12px 0; background: var(--surface-2); border-radius: 12px; box-shadow: var(--shadow-2); padding: 12px; display: grid; gap: 8px; }
.sheet[hidden] { display: none; }
.sheet h3 { margin: 0; font-size: .92rem; }
.sheet p { margin: 0; font-size: .76rem; color: var(--muted); }
.places { display: grid; gap: 6px; }
.places button { background: var(--raised); color: var(--sand); text-align: left; font-weight: 600; }
.row { display: flex; gap: 6px; }
.row input { flex: 1; min-width: 0; }
input[type="text"] { font: inherit; border: 1px solid var(--line); border-radius: 8px; min-height: 48px; padding: 9px 11px; background: var(--surface); color: var(--ink); }
.go { background: var(--car); color: var(--bg); --state: 0, 13, 28; }
.recbtn { width: 76px; height: 76px; border-radius: 50% !important; justify-self: center; background: var(--red-fill) !important; color: #fff; box-shadow: var(--shadow-2); font-size: 1.6rem !important; padding: 0 !important; }
.recbtn.on { animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(230, 51, 18, .28); } }
.timer { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.send { background: var(--act); color: var(--on-act); --state: 0, 13, 28; }
.ghost { background: var(--raised); color: var(--ink); }
audio { width: 100%; }
.err { color: var(--red); font-size: .78rem; }
.bar { display: flex; gap: 6px; padding: 8px 12px 6px; }
.bar input { flex: 1; min-width: 0; }
.bar button { background: var(--act); color: var(--on-act); --state: 0, 13, 28; }
.hint { font-size: .7rem; color: var(--muted); padding: 0 14px 10px; }
.consent { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: .76rem; }
.consent input { accent-color: var(--act); }
.consent label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.consent small { color: var(--muted); }
/* Material-style layer (Hyundai shape: small radii, medium-weight titles) */
h1, h2, h3 { font-weight: 600; letter-spacing: -.01em; }
button { transition: background-color .15s ease, box-shadow .15s ease; }
button:not(:disabled):hover { background-image: linear-gradient(rgba(var(--state, 255, 255, 255), .08), rgba(var(--state, 255, 255, 255), .08)); }
button:not(:disabled):active { background-image: linear-gradient(rgba(var(--state, 255, 255, 255), .12), rgba(var(--state, 255, 255, 255), .12)); }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="ico">가</span>
    <div class="t"><b>우리 가족방</b><small id="link">연결 확인 중…</small></div>
    <div class="who" role="group" aria-label="보내는 사람" id="who"></div>
  </div>
  <div class="consent" id="consentBar" hidden>
    <label><input type="checkbox" id="consentBox"><span>서비스 개선용 사용 기록에 동의<br><small>기능 이름과 시각만 가명으로 저장 · 위치·메시지·음성은 저장 안 함 · 끄면 즉시 삭제</small></span></label>
  </div>

  <div class="chat" id="chat" aria-live="polite"><div class="empty">아직 대화가 없어요.<br>아래에서 픽업을 요청하거나 응원 음성을 보내 보세요.</div></div>

  <div class="actions">
    <button class="pick" type="button" id="pickBtn" aria-expanded="false" aria-controls="pickSheet">데리러 와</button>
    <button class="cheer" type="button" id="cheerBtn" aria-expanded="false" aria-controls="cheerSheet">응원 녹음</button>
  </div>

  <div class="sheet" id="pickSheet" hidden>
    <h3>어디로 데리러 갈까요?</h3>
    <div class="places" id="places"></div>
    <div class="row"><input type="text" id="placeInput" maxlength="40" placeholder="직접 입력 (예: ○○역 2번 출구)" aria-label="장소 직접 입력"><button class="go" type="button" id="placeGo">요청</button></div>
    <p>아빠 차 화면에 "경유지로 추가할까요?" 카드가 뜨고 음성으로 물어봐요.</p>
  </div>

  <div class="sheet" id="cheerSheet" hidden>
    <h3>응원 음성 녹음 <span class="muted" style="font-weight:400;font-size:.76rem">· 최대 15초</span></h3>
    <button class="recbtn" type="button" id="recBtn" aria-label="녹음 시작">●</button>
    <div class="timer" id="timer">0:00 / 0:15</div>
    <div id="preview" hidden style="display:grid;gap:8px">
      <audio id="player" controls></audio>
      <input type="text" id="caption" maxlength="300" placeholder="한 줄 메모 (선택, 예: 조심히 와~)" aria-label="한 줄 메모">
      <div class="row"><button class="ghost" type="button" id="redo">다시 녹음</button><button class="send" type="button" id="sendCheer" style="flex:1">보내기</button></div>
    </div>
    <p>보내면 차에서 바로 재생돼요. 운전 중에도 아빠가 들을 수 있어요.</p>
    <div class="err" id="recErr"></div>
  </div>

  <form class="bar" id="bar">
    <input type="text" id="text" maxlength="300" placeholder="가족에게 메시지" aria-label="메시지" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="hint">글은 가족방에만 올라가요. 운전 중인 아빠에게 읽어 주지 않아요.</div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const SENDERS = ["엄마", "민지"];
  const PLACES = ["○○수학학원 앞", "집"];
  const AVATAR = { "엄마": "#9b6255", "민지": "#79619e", "아빠": "#45617b" };
  const MAX_REC_MS = 15000;
  // one-tap voice replies to a safety alert (server QUICK_REPLIES): sender -> [clip, words]
  const quickSent = new Set(); // feed seqs of safety alerts already answered, so a redraw keeps the button off
  const QUICK = { "엄마": ["cheer_mom_slow", "천천히 와도 돼. 안전이 제일이야"], "민지": ["cheer_minji_slow", "아빠, 천천히 와~ 사랑해"] };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: keep in memory only */ } } };
  const params = new URLSearchParams(location.search);
  let me = SENDERS.includes(params.get("as")) ? params.get("as") : (SENDERS.includes(store.get("sender")) ? store.get("sender") : SENDERS[0]);
  let feedSeq = 0;

  function renderWho() {
    $("who").innerHTML = SENDERS.map(s => `<button type="button" aria-pressed="${s === me}" data-s="${s}">${s}</button>`).join("");
    $("who").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { me = b.dataset.s; store.set("sender", me); renderWho(); redraw(); }));
  }

  // ---- chat feed ----
  let items = [];
  function bubble(it) {
    if (it.kind === "cheer_played") return `<div class="sys">차에서 재생됨 · ${esc(it.text)} · ${esc(it.at)}</div>`;
    if (it.kind === "cheer_skipped") return `<div class="sys">운전자가 차에서 응원 듣기를 꺼 두어 재생하지 않았어요 · ${esc(it.text)} · ${esc(it.at)}</div>`;
    if (it.kind === "safety") {
      const [clip, words] = QUICK[me];
      return `<div class="msg car safety"><span class="av">차</span>
        <div><div class="b">${esc(it.text)}<br>${quickSent.has(it.seq) ? '<button type="button" class="quick" disabled>목소리를 보냈어요</button>'
          : `<button type="button" class="quick" data-clip="${clip}" data-seq="${it.seq}">${esc(me)} 목소리로 "${esc(words)}"</button>`}</div>
        <small>현대 패밀리 카신저 안전 알림 · ${esc(it.at)}</small></div></div>`;
    }
    const car = it.kind === "message";
    const mine = !car && it.sender === me;
    const color = car ? "" : `style="background:${AVATAR[it.sender] || "#79619e"}"`;
    const who = car ? "현대 패밀리 카신저 차량 알림" : it.sender;
    // a cheer waits in the car's queue until the car reports it started playing, or skipped it (same cheer_id)
    const settled = kind => it.cheer_id != null && items.some(x => x.kind === kind && x.cheer_id === it.cheer_id);
    const cheerState = it.cheer_id == null ? "" : settled("cheer_played") ? '<span class="cs played">차에서 재생됨</span>'
      : settled("cheer_skipped") ? '<span class="cs skipped">운전자가 응원 듣기를 꺼 둠</span>'
      : '<span class="cs waiting">차에서 재생 대기 중</span>';
    return `<div class="msg ${car ? "car" : "fam"} ${mine ? "me" : ""}"><span class="av" ${color}>${esc(car ? "차" : it.sender.slice(0, 1))}</span>
      <div><div class="b">${esc(it.text)}</div>${cheerState}<small>${esc(who)} · ${esc(it.at)}</small></div></div>`;
  }
  function redraw() {
    // only what a family member would see: family posts, car notifications and played cheers (not the car's internal notes)
    const shown = items.filter(it => ["family", "message", "cheer_played", "cheer_skipped", "safety"].includes(it.kind));
    const chat = $("chat");
    if (!shown.length) {
      chat.innerHTML = '<div class="empty">아직 대화가 없어요.<br>아래에서 픽업을 요청하거나 응원 음성을 보내 보세요.</div>';
      return;
    }
    chat.innerHTML = shown.map(bubble).join("");
    chat.scrollTop = chat.scrollHeight;
  }
  async function pollFeed() {
    try {
      const r = await fetch("api/family/feed?after=" + feedSeq);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      $("link").textContent = "아빠 차와 연결됨"; $("link").className = "";
      if (d.reset) { items = []; feedSeq = 0; redraw(); return; }
      if (d.items.length) { items = [...items, ...d.items]; feedSeq = d.items[d.items.length - 1].seq; redraw(); }
    } catch (e) {
      $("link").textContent = "가족 서버에 연결할 수 없어요"; $("link").className = "bad";
    }
  }

  async function postJson(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "보내지 못했어요"); }
    pollFeed();
  }

  $("chat").addEventListener("click", async ev => {
    const b = ev.target.closest("button.quick");
    if (!b) return;
    b.disabled = true;
    try { quickSent.add(Number(b.dataset.seq)); await postJson("api/family/quick", { clip: b.dataset.clip }); redraw(); }
    catch (e) { quickSent.delete(Number(b.dataset.seq)); alert(e.message); b.disabled = false; }
  });

  // ---- text ----
  $("bar").addEventListener("submit", async ev => {
    ev.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    try { await postJson("api/family/say", { sender: me, text }); $("text").value = ""; } catch (e) { alert(e.message); }
  });

  // ---- sheets ----
  function toggle(btn, sheet, other, otherSheet) {
    const open = sheet.hidden;
    sheet.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) { otherSheet.hidden = true; other.setAttribute("aria-expanded", "false"); }
  }
  $("pickBtn").addEventListener("click", () => toggle($("pickBtn"), $("pickSheet"), $("cheerBtn"), $("cheerSheet")));
  $("cheerBtn").addEventListener("click", () => toggle($("cheerBtn"), $("cheerSheet"), $("pickBtn"), $("pickSheet")));

  // ---- pickup ----
  async function requestPickup(place) {
    if (!place) return;
    try {
      await postJson("api/family/pickup", { sender: me, place });
      $("placeInput").value = ""; $("pickSheet").hidden = true; $("pickBtn").setAttribute("aria-expanded", "false");
    } catch (e) { alert(e.message); }
  }
  $("places").innerHTML = PLACES.map(p => `<button type="button" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  $("places").querySelectorAll("button").forEach(b => b.addEventListener("click", () => requestPickup(b.dataset.p)));
  $("placeGo").addEventListener("click", () => requestPickup($("placeInput").value.trim()));

  // ---- cheer recording ----
  let rec = null, blob = null, startedAt = 0, durationMs = 0, tick = null, autoStop = null;
  const clock = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const pickType = () => ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";

  async function startRec() {
    $("recErr").textContent = "";
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { $("recErr").textContent = "마이크를 쓸 수 없어요: " + e.message; return; }
    const type = pickType();
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      durationMs = Math.min(Date.now() - startedAt, MAX_REC_MS);
      blob = new Blob(chunks, { type: rec.mimeType || type || "audio/webm" });
      $("player").src = URL.createObjectURL(blob);
      $("preview").hidden = false;
      $("recBtn").classList.remove("on"); $("recBtn").textContent = "●"; $("recBtn").setAttribute("aria-label", "녹음 시작");
      clearInterval(tick); clearTimeout(autoStop); rec = null;
      $("timer").textContent = `${clock(durationMs)} 녹음됨`;
    };
    rec.start();
    startedAt = Date.now();
    $("preview").hidden = true;
    $("recBtn").classList.add("on"); $("recBtn").textContent = "■"; $("recBtn").setAttribute("aria-label", "녹음 끝내기");
    tick = setInterval(() => { $("timer").textContent = `${clock(Date.now() - startedAt)} / 0:15`; }, 200);
    autoStop = setTimeout(() => rec && rec.stop(), MAX_REC_MS);
  }
  $("recBtn").addEventListener("click", () => (rec ? rec.stop() : startRec()));
  $("redo").addEventListener("click", () => { blob = null; $("preview").hidden = true; $("timer").textContent = "0:00 / 0:15"; startRec(); });
  $("sendCheer").addEventListener("click", async () => {
    if (!blob) return;
    const q = new URLSearchParams({ sender: me, text: $("caption").value.trim(), duration_ms: String(durationMs) });
    $("sendCheer").disabled = true;
    try {
      const r = await fetch("api/family/cheer?" + q, { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "보내지 못했어요"); }
      blob = null; $("caption").value = ""; $("preview").hidden = true; $("timer").textContent = "0:00 / 0:15";
      $("cheerSheet").hidden = true; $("cheerBtn").setAttribute("aria-expanded", "false");
      pollFeed();
    } catch (e) { $("recErr").textContent = e.message; }
    finally { $("sendCheer").disabled = false; }
  });

  // usage recording for retention: off until the family ticks the box; unticking deletes what was kept
  fetch("api/analytics").then(r => r.json()).then(d => {
    if (!d.enabled) return;
    $("consentBox").checked = d.consent;
    $("consentBar").hidden = false;
  }).catch(() => { /* recording is optional: the family room works without it */ });
  $("consentBox").addEventListener("change", async ev => {
    const box = ev.target;
    box.disabled = true;
    try { await postJson("api/analytics/consent", { granted: box.checked }); }
    catch (e) { box.checked = !box.checked; alert(e.message); }
    finally { box.disabled = false; }
  });

  renderWho();
  pollFeed();
  setInterval(pollFeed, 1000);
})();
</script>
</body>
</html>
